    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://crm-ep4i.onrender.com" crossorigin />

    <meta name="description" content="Travel-Trade CRM: leads, follow-ups, tasks, team daily reports and email campaigns for export &amp; trade sales teams. Start free." />
    <title>Travel-Trade CRM — Export &amp; Trade Sales CRM</title>
    <link rel="canonical" href="https://crm-amber-nine.vercel.app/" />
    <!-- Link preview (WhatsApp, LinkedIn, Facebook, Slack, X): a picture instead of a bare link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel-Trade CRM" />
    <meta property="og:title" content="Travel-Trade CRM — every buyer, follow-up and deal in one place" />

    <meta property="og:image" content="https://crm-amber-nine.vercel.app/og-image.jpg" />

    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel-Trade CRM — every buyer, follow-up and deal in one place" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var msg = (e && e.message ? e.message : '').toLowerCase();
        if (msg.indexOf('failed to fetch dynamically imported module') > -1 || msg.indexOf('loading chunk') > -1) {
          try {
            if (!sessionStorage.getItem('crm_boot_reload')) {
              sessionStorage.setItem('crm_boot_reload', '1');
              window.location.reload();
            }
          } catch (err) {
            window.location.reload();
          }
        }
      });
    </script>
    <script>
      // If the app has not started after 12 seconds (very old browser or blocked script), explain instead of a blank page
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#0f172a">' +
            '<h2 style="margin:0 0 8px">The CRM could not start</h2>' +
            '<p style="color:#475569;line-height:1.5">Please refresh the page. If this keeps happening, update your browser (Safari / iOS 14 or newer, or the latest Chrome).</p>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:700">Refresh</button></div>';
        }
      }, 12000);
    </script>
    <noscript>Please enable JavaScript to use the CRM.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
