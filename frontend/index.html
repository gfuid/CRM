<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z'/><path d='M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2'/><path d='M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2'/><path d='M10 6h4'/><path d='M10 10h4'/><path d='M10 14h4'/><path d='M10 18h4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Travel-Trade CRM - Enterprise Sales Pipeline, Contacts Management and Real-time Deal Tracking Dashboard." />
    <title>Travel-Trade CRM - Sales Pipeline & Contacts Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var msg = (e && e.message ? e.message : '').toLowerCase();
        if (msg.indexOf('failed to fetch dynamically imported module') > -1 || msg.indexOf('loading chunk') > -1) {
          try {
            if (!sessionStorage.getItem('crm_boot_reload')) {
              sessionStorage.setItem('crm_boot_reload', '1');
              window.location.reload();
            }
          } catch (err) {
            window.location.reload();
          }
        }
      });
    </script>
    <script>
      // If the app has not started after 12 seconds (very old browser or blocked script), explain instead of a blank page
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#0f172a">' +
            '<h2 style="margin:0 0 8px">The CRM could not start</h2>' +
            '<p style="color:#475569;line-height:1.5">Please refresh the page. If this keeps happening, update your browser (Safari / iOS 14 or newer, or the latest Chrome).</p>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:700">Refresh</button></div>';
        }
      }, 12000);
    </script>
    <noscript>Please enable JavaScript to use the CRM.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
