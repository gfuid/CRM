name: CRM Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 🧪 Backend API & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Integration & Health Tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_123456789
          ADMIN_USERNAME: traveltrade_admin
          ADMIN_EMAIL: admin@travel-trade.com
          ADMIN_PASSWORD: 'TravelTrade#Admin2026!'
        run: |
          cd backend
          npm test

  frontend-build:
    name: 📦 Frontend Client Build & Optimization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Compile & Build Frontend Assets (Vite)
        env:
          VITE_API_URL: https://crm-ep4i.onrender.com/api/v1
        run: |
          cd frontend
          npm run build

  admin-build:
    name: 🛡️ Admin Console Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin/package-lock.json'

      - name: Install Admin Dependencies
        run: |
          cd admin
          npm install

      - name: Compile & Build Admin Console (Vite)
        env:
          VITE_API_URL: https://crm-ep4i.onrender.com/api/v1
        run: |
          cd admin
          npm run build

  deploy-notification:
    name: 🚀 Production Deployment Sync
    needs: [backend-test, frontend-build, admin-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deployment Webhook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated backend deployment on Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."

      - name: Log Deployment Status
        run: |
          echo "=========================================================="
          echo "🎉 All CI/CD Pipeline Checks Passed Successfully!"
          echo "🌐 Sales CRM: https://crm-amber-nine.vercel.app"
          echo "🛡️ Admin Console: https://crm-b2g7.vercel.app"
          echo "🍃 Backend API: https://crm-ep4i.onrender.com/api/v1"
          echo "🩺 Healthcheck: https://crm-ep4i.onrender.com/health"
          echo "=========================================================="
